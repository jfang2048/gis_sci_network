project_version: 0.1.0
analysis:
  start_year: 2010
  end_year: 2025
  include_partial_current_year: false
corpus_views:
  - strict
  - broad
hierarchy_views:
  - organization
  - umbrella
random_seed: 20250805
consortium:
  warning_institution_count: 25
  exclusion_institution_count: 100
network:
  persistence_windows:
    - 3
    - 5
  minimum_fractional_weight: 0.0
  approximate_betweenness_threshold: 10000
openalex:
  base_url: https://api.openalex.org
  timeout_seconds: 30.0
  max_retries: 5
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30.0
  jitter_seconds: 0.25
  per_page: 200
  cache_directory: data/cache/openalex
  checkpoint_directory: .agent/checkpoints/openalex
geography:
  mapping_path: config/regions.yml
  override_path: config/region_overrides.yml
