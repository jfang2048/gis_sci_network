[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gis-collaboration-network"
version = "0.1.0"
description = "Reproducible dynamic GIS institutional collaboration networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GIS Collaboration Network contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
gisnet = "gisnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gisnet"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "network: tests that require external network access",
  "integration: integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "outputs", ".agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["gisnet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src/gisnet"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
